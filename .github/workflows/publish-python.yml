name: Publish Python package to PyPI

# Builds the `blackchirp` Python package (python/blackchirp/) and uploads it
# to PyPI using PyPI's trusted-publishing flow (OIDC) — no API token is
# stored in the repository. Triggered manually from the Actions tab; the
# package version is whatever python/blackchirp/pyproject.toml declares, so
# bump it in the same change that ships the release before running this.
#
# Trusted-publisher setup (one-time, on pypi.org, by a project owner):
#   PyPI project "blackchirp" -> Settings -> Publishing -> add a GitHub
#   trusted publisher with
#     Owner:            <this repo's owner>
#     Repository:       <this repo's name>
#     Workflow name:    publish-python.yml
#     Environment name: pypi
#   The workflow filename and environment below must match that registration
#   exactly, or PyPI rejects the OIDC token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build distributions
        working-directory: python/blackchirp
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/blackchirp/dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment gates the publish behind PyPI's trusted-publisher
    # environment binding (and lets you add required-reviewer protection
    # rules in the repo's Settings -> Environments -> pypi if desired).
    environment:
      name: pypi
      url: https://pypi.org/project/blackchirp/
    permissions:
      # id-token: write lets the publish action mint the OIDC token PyPI
      # exchanges for a short-lived upload credential. Confined to this job
      # so no other step can request it.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish
        # Uploads everything under dist/ and (with id-token above) attaches
        # PEP 740 attestations by default. Fails loudly if the version
        # already exists on PyPI, so an accidental re-run without a version
        # bump does not silently succeed.
        uses: pypa/gh-action-pypi-publish@release/v1
